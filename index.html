<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feliz Día de la Novia ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Georgia, serif;
      color: white;
      user-select: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* CAPA INTRO CINEMÁTICA */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      cursor: pointer;
      transition: opacity 1.2s ease, visibility 1.2s;
    }
    #start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .typewriter-text {
      font-size: 1.35rem;
      line-height: 1.8;
      max-width: 680px;
      text-align: center;
      color: #e0e0e0;
      font-style: italic;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
      min-height: 120px;
    }

    .loading-dots::after {
      content: '.';
      animation: dots 1.5s steps(5, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    .initial-hint {
      position: absolute;
      bottom: 40px;
      font-size: 0.8rem;
      color: #666;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    /* ENCABEZADO PRINCIPAL */
    #ui {
      position: absolute;
      top: 35px;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease;
    }
    #ui.visible {
      opacity: 1;
    }
    h1 {
      font-size: 2rem;
      text-shadow: 0 0 15px #ff0033, 0 0 30px #ff0033;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .heart-icon {
      display: inline-block;
      animation: heartbeat 1.2s infinite;
      color: #ff0033;
    }
    @keyframes heartbeat {
      0% { transform: scale(1); }
      15% { transform: scale(1.3); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
      60% { transform: scale(1); }
    }

    /* MODAL CARTA */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
      padding: 20px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      background: linear-gradient(145deg, #1f020a, #0d0005);
      border: 1.5px solid #ff0033;
      box-shadow: 0 0 35px rgba(255, 0, 51, 0.5);
      border-radius: 20px;
      max-width: 520px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 30px;
      position: relative;
      transform: scale(0.85);
      transition: transform 0.4s ease;
    }
    .modal-overlay.active .card {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      background: none;
      border: none;
      color: #ff4d6d;
      font-size: 1.6rem;
      cursor: pointer;
    }
    .card h2 {
      color: #ff3355;
      margin-bottom: 18px;
      font-size: 1.6rem;
      text-align: center;
    }
    .card p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #ffe6eb;
      margin-bottom: 15px;
      text-align: left;
    }
    .card-footer {
      text-align: center;
      font-size: 1.5rem;
      margin-top: 20px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- PANTALLA INTRO -->
  <div id="start-screen">
    <div class="typewriter-text" id="typewriter"></div>
    <div class="initial-hint" id="hint">Haz clic en cualquier parte para iniciar</div>
  </div>

  <div id="ui">
    <h1>Feliz día de la novia, mi amor. Te lo mereces todo <span class="heart-icon">❤️</span></h1>
  </div>

  <audio id="bg-music" loop src="musica.mp3"></audio>

  <!-- MODAL CARTA -->
  <div class="modal-overlay" id="cartaModal">
    <div class="card">
      <button class="close-btn" id="closeBtn">✕</button>
      <h2>Para mi persona favorita ❤️</h2>
      <div id="cartaContenido">
        <p><strong>Mi Teriancita hermosa,</strong></p>
        <p>
          [AQUÍ ESCRIBES TU CARTA CON TODO EL LÍRICO].
        </p>
      </div>
      <div class="card-footer">💌✨</div>
    </div>
  </div>

  <script>
    // --- ESCENA & CÁMARA 360 TOTAL ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 48);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.enableZoom = true;
    controls.minDistance = 15;
    controls.maxDistance = 120;
    controls.minPolarAngle = 0; 
    controls.maxPolarAngle = Math.PI; 

    const galaxyGroup = new THREE.Group();
    scene.add(galaxyGroup);

    // --- 1. ESTRELLAS ---
    const starCount = 3500;
    const starGeometry = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);

    for(let i = 0; i < starCount * 3; i+=3) {
      starPos[i] = (Math.random() - 0.5) * 300;
      starPos[i+1] = (Math.random() - 0.5) * 300;
      starPos[i+2] = (Math.random() - 0.5) * 300;
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.45, transparent: true, opacity: 0.9 });
    const starField = new THREE.Points(starGeometry, starMaterial);
    galaxyGroup.add(starField);

    // --- 2. CORAZÓN 3D ---
    const heartGroup = new THREE.Group();
    const heartCount = 4000;
    const heartPos = new Float32Array(heartCount * 3);

    for (let i = 0; i < heartCount; i++) {
      let t = Math.PI * (Math.random() * 2 - 1);
      let u = (Math.random() - 0.5);

      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      let z = u * 2.5;

      heartPos[i * 3]     = (x + (Math.random() - 0.5) * 0.8) * 0.6;
      heartPos[i * 3 + 1] = (y + (Math.random() - 0.5) * 0.8) * 0.6;
      heartPos[i * 3 + 2] = (z + (Math.random() - 0.5) * 0.8) * 0.6;
    }

    const heartGeometry = new THREE.BufferGeometry();
    heartGeometry.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
    const heartMaterial = new THREE.PointsMaterial({
      color: 0xff0033,
      size: 0.42,
      transparent: true,
      blending: THREE.AdditiveBlending
    });
    const heartMesh = new THREE.Points(heartGeometry, heartMaterial);
    heartGroup.add(heartMesh);
    scene.add(heartGroup);

    heartGroup.scale.set(0, 0, 0);
    galaxyGroup.scale.set(0, 0, 0);

    // --- 3. FOTO AJUSTADA (REBAJADA Y CENTRADA PERFECTAMENTE) ---
    const photoTextureLoader = new THREE.TextureLoader();
    // Escala 5.2 x 9.2: calza perfecta sin salir por la hendidura superior
    const photoGeom = new THREE.PlaneGeometry(5.2, 9.2);
    const photoMat = new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, transparent: true });
    const photoMesh = new THREE.Mesh(photoGeom, photoMat);
    
    // Posición Y bajada a 0.25 para centrarla en el corazón
    photoMesh.position.set(0, 0.25, 0); 
    heartGroup.add(photoMesh);

    // ARREGLO DE 15 FOTOS
    const misFotos = [
      'foto1.jpg', 'foto2.jpg', 'foto3.jpg', 'foto4.jpg', 'foto5.jpg',
      'foto6.jpg', 'foto7.jpg', 'foto8.jpg', 'foto9.jpg', 'foto10.jpg',
      'foto11.jpg', 'foto12.jpg', 'foto13.jpg', 'foto14.jpg', 'foto15.jpg'
    ];
    const photoTextures = [];

    misFotos.forEach(foto => {
      photoTextureLoader.load(foto, (tex) => {
        photoTextures.push(tex);
        if (photoTextures.length === 1) photoMat.map = tex;
      });
    });

    let currentFotoIdx = 0;
    setInterval(() => {
      if (photoTextures.length > 0) {
        currentFotoIdx = (currentFotoIdx + 1) % photoTextures.length;
        photoMat.map = photoTextures[currentFotoIdx];
        photoMat.needsUpdate = true;
      }
    }, 3800);

    // --- 4. ONDAS DE CORAZÓN ---
    const heartWaves = [];
    function createHeartWave() {
      const waveMesh = heartMesh.clone();
      waveMesh.material = heartMaterial.clone();
      waveMesh.material.opacity = 0.65;
      scene.add(waveMesh);
      heartWaves.push({ mesh: waveMesh, scale: heartGroup.scale.x, opacity: 0.65 });
    }

    // --- 5. ELEMENTOS FLOTANTES ---
    const floatingItems = [];
    function createFloatingItem() {
      if (floatingItems.length > 20) return;
      
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.font = '36px Arial';

      const isBunny = Math.random() < 0.25; 
      ctx.fillText(isBunny ? '🐰' : '💖', 10, 45);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.85 });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(isBunny ? 2.4 : 1.9, isBunny ? 2.4 : 1.9, 1);

      sprite.position.x = (Math.random() - 0.5) * 22;
      sprite.position.y = (Math.random() - 0.5) * 16;
      sprite.position.z = (Math.random() - 0.5) * 10;
      
      galaxyGroup.add(sprite);
      floatingItems.push({ sprite, speedY: 0.025 + Math.random() * 0.02, opacity: 0.85 });
    }

    // --- 6. FRASES ALREDEDOR ---
    const frases = [
      "Mi Teriancita 🐾", 
      "Te amo con el alma ❤️", 
      "Eres mi lugar favorito ✨",
      "Gracias por ser mía 💖", 
      "Mi corazón es tuyo 💕", 
      "Feliz día de la novia 🌹",
      "Mi novia es mi universo 🌌", 
      "Mi persona favorita 🧸", 
      "Juntos por siempre ♾️",
      "Mi lugar seguro 🏡", 
      "Eres mi sueño hecho realidad 💫", 
      "Gracias por existir 👑",
      "Una mujer como tú 💎",
      "Solo tú y yo 👩‍❤️‍👨",
      "Nadie brilla como tú ✨",
      "Es que tú eres una terian 🐾",
      "Somos virolos, pero nos amamos 🙈❤️"
    ];

    function createTextSprite(message) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;

      ctx.font = 'Bold 28px Arial';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ff0033';
      ctx.shadowBlur = 14;
      ctx.textAlign = 'center';
      ctx.fillText(message, 256, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(11, 2.75, 1);
      return sprite;
    }

    frases.forEach((frase, index) => {
      const sprite = createTextSprite(frase);
      const angle = (index / frases.length) * Math.PI * 2;
      const radius = 27 + (index % 3) * 4; 
      sprite.position.x = Math.cos(angle) * radius;
      sprite.position.y = (Math.sin(index * 2) * 9);
      sprite.position.z = Math.sin(angle) * radius;
      galaxyGroup.add(sprite);
    });

    // --- 7. SNOOPYS FLOTANTES (5 IMÁGENES) ---
    const imagenesSnoopy = [
      'snoopy1.png', 'snoopy2.png', 'snoopy3.png', 'snoopy4.png', 'snoopy5.png'
    ];

    imagenesSnoopy.forEach((imgSrc, index) => {
      photoTextureLoader.load(imgSrc, (texture) => {
        const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(6.5, 6.5, 1);

        const angle = ((index + 0.2) / imagenesSnoopy.length) * Math.PI * 2;
        const radius = 22;
        sprite.position.x = Math.cos(angle) * radius;
        sprite.position.y = (index % 2 === 0 ? 5 : -5);
        sprite.position.z = Math.sin(angle) * radius;

        galaxyGroup.add(sprite);
      });
    });

    // --- LÓGICA INTRO ---
    const textoIntro = "Tal vez no te puedo dar algo físico o algún detalle muy hermoso, pero no quería quedarme sin hacer nada, así que espero que te guste, Teriancita";
    const typewriterElement = document.getElementById('typewriter');
    const startScreen = document.getElementById('start-screen');
    const music = document.getElementById('bg-music');

    let charIndex = 0;
    let musicStarted = false;
    let holePhase = false;

    function typeWriterEffect() {
      if (charIndex < textoIntro.length) {
        typewriterElement.textContent += textoIntro.charAt(charIndex);
        charIndex++;
        setTimeout(typeWriterEffect, 100);
      } else {
        const dotsSpan = document.createElement('span');
        dotsSpan.className = 'loading-dots';
        typewriterElement.appendChild(dotsSpan);
      }
    }

    window.addEventListener('click', startExperience, { once: true });
    window.addEventListener('keydown', startExperience, { once: true });

    function startExperience() {
      if (!musicStarted) {
        musicStarted = true;
        music.play();
        document.getElementById('hint').style.display = 'none';
        typeWriterEffect();
      }
    }

    // --- ANIMACIÓN PRINCIPAL ---
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.03;

      if (musicStarted) {
        let currentTime = music.currentTime;

        if (currentTime >= 18 && currentTime < 21) {
          if (!holePhase) {
            holePhase = true;
            startScreen.classList.add('hidden');
          }
          camera.position.z -= 0.65;
          starField.rotation.z += 0.09;
        } 
        else if (currentTime >= 21) {
          const scaleVal = THREE.MathUtils.lerp(galaxyGroup.scale.x, 1, 0.08);
          heartGroup.scale.set(scaleVal, scaleVal, scaleVal);
          galaxyGroup.scale.set(scaleVal, scaleVal, scaleVal);

          camera.position.z = THREE.MathUtils.lerp(camera.position.z, 48, 0.08);

          document.getElementById('ui').classList.add('visible');

          const beat = 1 + Math.sin(time * 3) * 0.07 + Math.pow(Math.sin(time * 6), 2) * 0.03;
          heartGroup.scale.set(beat, beat, beat);

          if (Math.sin(time * 3) > 0.96 && Math.random() < 0.3) {
            createHeartWave();
          }

          if (Math.random() < 0.06) {
            createFloatingItem();
          }

          galaxyGroup.rotation.y += 0.002;
        }
      }

      for (let i = heartWaves.length - 1; i >= 0; i--) {
        const hw = heartWaves[i];
        hw.scale += 0.025;
        hw.opacity -= 0.015;
        hw.mesh.scale.set(hw.scale, hw.scale, hw.scale);
        hw.mesh.material.opacity = hw.opacity;

        if (hw.opacity <= 0) {
          scene.remove(hw.mesh);
          hw.mesh.geometry.dispose();
          hw.mesh.material.dispose();
          heartWaves.splice(i, 1);
        }
      }

      for (let i = floatingItems.length - 1; i >= 0; i--) {
        const fi = floatingItems[i];
        fi.sprite.position.y += fi.speedY;
        fi.opacity -= 0.005;
        fi.sprite.material.opacity = fi.opacity;

        if (fi.opacity <= 0) {
          galaxyGroup.remove(fi.sprite);
          floatingItems.splice(i, 1);
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // MODAL CARTA
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const modal = document.getElementById('cartaModal');
    const closeBtn = document.getElementById('closeBtn');

    window.addEventListener('click', (e) => {
      if (modal.classList.contains('active') || !startScreen.classList.contains('hidden')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects([heartMesh, photoMesh]);

      if (intersects.length > 0) {
        modal.classList.add('active');
      }
    });

    closeBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
