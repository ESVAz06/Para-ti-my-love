<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feliz Día de la Novia ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      background-color: #000;
      font-family: 'Segoe UI', Georgia, serif;
      color: white;
      user-select: none;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* CAPA INTRO CINEMÁTICA */
    #start-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      cursor: pointer;
      transition: opacity 1.2s ease, visibility 1.2s;
    }
    #start-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .typewriter-text {
      font-size: 1.35rem;
      line-height: 1.8;
      max-width: 680px;
      text-align: center;
      color: #e0e0e0;
      font-style: italic;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
      min-height: 120px;
    }

    .loading-dots::after {
      content: '.';
      animation: dots 1.5s steps(5, end) infinite;
    }
    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    .initial-hint {
      position: absolute;
      bottom: 40px;
      font-size: 0.8rem;
      color: #666;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }

    /* ENCABEZADO PRINCIPAL */
    #ui {
      position: absolute;
      top: 35px;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease;
    }
    #ui.visible {
      opacity: 1;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 1px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .heart-icon {
      display: inline-block;
      animation: heartbeat 1.2s infinite;
      color: #ff0033;
    }
    @keyframes heartbeat {
      0% { transform: scale(1); }
      15% { transform: scale(1.3); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
      60% { transform: scale(1); }
    }

    /* MODAL ELEGANTE */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
      padding: 20px;
    }
    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      background: rgba(18, 14, 20, 0.85);
      border: 1px solid rgba(220, 175, 185, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(200, 100, 120, 0.15);
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 35px 30px;
      position: relative;
      transform: translateY(20px) scale(0.95);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-overlay.active .card {
      transform: translateY(0) scale(1);
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 22px;
      background: none;
      border: none;
      color: #d4a5b0;
      font-size: 1.4rem;
      cursor: pointer;
      transition: color 0.2s;
    }
    .close-btn:hover {
      color: #ffffff;
    }
    .card h2 {
      color: #f3d5dc;
      font-weight: 400;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      font-size: 1.35rem;
      text-align: center;
      border-bottom: 1px solid rgba(243, 213, 220, 0.15);
      padding-bottom: 12px;
    }
    .card p {
      font-size: 1rem;
      line-height: 1.8;
      color: #e6d8dc;
      margin-bottom: 15px;
      text-align: justify;
      font-weight: 300;
    }
    .card-footer {
      text-align: center;
      font-size: 1.1rem;
      color: #d4a5b0;
      margin-top: 25px;
      letter-spacing: 3px;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- PANTALLA INTRO -->
  <div id="start-screen">
    <div class="typewriter-text" id="typewriter"></div>
    <div class="initial-hint" id="hint">Haz clic en cualquier parte para iniciar</div>
  </div>

  <div id="ui">
    <h1>Feliz día de la novia, mi amor. Eres mi Theriancita perfecta. <span class="heart-icon">❤️</span></h1>
  </div>

  <audio id="bg-music" loop src="musica.mp3"></audio>

  <!-- MODAL DE MOMENTOS -->
  <div class="modal-overlay" id="cartaModal">
    <div class="card">
      <button class="close-btn" id="closeBtn">✕</button>
      <h2 id="modalTitulo">Momento 1 ✨</h2>
      <div id="cartaContenido">
        <p id="modalTexto">Escribe aquí el recuerdo de esta foto...</p>
      </div>
      <div class="card-footer">✦ ✦ ✦</div>
    </div>
  </div>

  <script>
    // --- HISTORIAS / TEXTOS DE CADA FOTO ---
    const historiasFotos = {
      0: { 
        titulo: "Mi theriansita", 
        texto: "Todavía recuerdo el día en el que te comiste paté de gato pensando que era un yogurt en sobrecito. Y... nos cagabamos de risa ese día. Eso que nos estábamos conociendo. Pero cada vez que veo la foto, me da risa y ternura jsjsj,  esos momentos los cuales siempre voy a atesorar. Te amo, mi theriansita." 
      },
      1: { 
        titulo: "Paseando a Bambie", 
        texto: "¿Te acuerdas la vez en la que caminamos como chaskis por todo Miraflores cargando a Bambie y nos fuimos hasta un Norkys que estaba más arriba del Kennedy para comprar pollo a la brasa? Y caminamos otra vez como chaskis y terminamos comiendo en el parque de San Ignacio. Estuvo rico porcierto. No lo voy a olvidar para nada, y luego terminamos con dolor de piernas. Pero fue de lo mejor, ademas fue en nuestro primer aniversario." 
      },
      2: { 
        titulo: "Foto para el face", 
        texto: "Recuerdo que esta vez nos fuimos al KFC. Habíamos comprado unas hamburguesas probando algo nuevo en teoría y luego nos fuimos a comerlo mirando el mar. Fue la vez que estabas triste y te dije que nos fuéramos, que me siguieras nada más. Y así terminamos en Miraflores. Aún lo recuerdo todavía. Primera vez que fuimos a Miraflores esa vez. Pero es otro de los recuerdo que simpre aparecen en mi mente cuando estoy solito y me sacan sorisas." 
      },
      3: { 
        titulo: "Inicio", 
        texto: "Recuerdo que esta foto fue de las primeras que publicamos en Instagram y, a pesar de que queríamos que no se enteren, amistades y amigos como Zoda se terminaron enterando." 
      },
      4: { titulo: "Toda una diva", texto: "Aqui receurdo que te puse mi polera, y te quedo perfecto, enserio!! la mayoria de mis casacas o accesorios te quedan divinos, resalta aun mas tu bellesa mi amorcito, aqun sin no lo cesites, porque incluso sin arreglarte eres completamente divina, TE AMO." },
      5: { titulo: "2 angelitos", texto: "Como olvidar cuadno preguntamos a tu beba, como serian nuestros hijitos, Dante y Danae, y aunque te dije esa vez, que yo quiero un niño, te juro que una princesita me haria muy feliz, daria todo por ella, de eso nunca lo dudes amor." },
      6: { titulo: "Mi sugar", texto: "No solo en este momento, sino que desde que nos conocemos, me has entendido cuando no eh tenido dinero, me acompañabas a clases, para poder pasar tiempo juuntos e incluso me invitavas tus cosas favorita, y hasta ahora lo haces, te juro que nadie lo ha hecho por mi ante, eso valoro demasiad de ti, y no me hace falta mas razones para elejirte siempre por encima de todo.<" },
      7: { titulo: "SQUINKLES FACIALES", texto: "Despues del rochimochi parcial, no hicimos limpieza facial, ojito que primera vez que me hacia uno, y fue de lo mejor, por que estaba a tu lado, te juro que cosas asi talvez no se me ocurran ami, pero siempre te dire si a probar cosas nueva, y quiero que tu tambien digas si cuando las proponga." },
      8: { titulo: "Pulseritas", texto: "COMO OLVIDAR, QUE SUFRI VARIOS INTENTOS PARA HACERTE TU PULSERITA, Y AL FINAL QUEDO BONITA, ME GUSTO QUE TE ENCANTARA AMOR AUNQUE YA NO LAS USEMOS" },
      9: { titulo: "TE AMOOO", texto: "Este dia.., casi termina mal, eneserio me acuerdo que pasamos un mal rato, pero no me arrepiento de arrodillarme y hacerte la promesa, que quiero estar contigo, y pasar de todo contigo en la malas y en las buenas amorcito" },
      10: { titulo: "Lammadas y desvelos", texto: "Aqui todavia nos conociamos, enserio momentos como este se quedan muy guardados en mi coranzocito, jsjsj, no olvidemos que estas fotos fue antes que me diera baricela, pero en fin solo contigo los desvelos son los mejores, te amo theriancita" },
      11: { titulo: "Mal humor", texto: "Queria poner esta foto, para recordarte que aunque te despierte de mal humor siempre, yo te amo, apesar de que te las agarresconmigo en ese momento, te amo, nada va cambiar, asi que sueña bonito amorcito" },
      12: { titulo: "KFC", texto: "Pongo esta foto para que momento asi sigan mas adelante, y tambien recordemos que esa ves fue cuando compramos kfc miraflores y nos fuimos a comer mirando el mal, se que puse una foto en el mismo lugar antes, pero igual me gusto esta con el filtro de dalmatas" },
      13: { titulo: "Me dejas enbobado", texto: "Nose por que aveces no te crees las cosas que dicen sobre ti, eres mul impresionante amor, aparte de bonita, eres perseverante, dedicada, eso si hay que manejar un poquito el estres , pero siempre tienes fuerzas cuando te lo propones, se que normalmente eres ensible, pero tambien tienes tu caracter, lo cual me gusta de ti, ensi amor lo que quiero decir, es que tu eres tu , y no eres inferior a nadie puedes hacer todo lo que te propones, y yo te apoyo en cada idea que se te prenda si?" },
      14: { titulo: "TE AMOOOOOOOOOOOOOOOOOOOOOOOOOOOO", texto: "En esos ojitos, mi sexto sentido" }
    };

    // --- ESCENA & CÁMARA LIBRE 360° ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 48);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.rotateSpeed = 0.8;
    controls.enableZoom = true;
    
    controls.minDistance = 0.1;
    controls.maxDistance = 500;
    controls.minPolarAngle = 0; 
    controls.maxPolarAngle = Math.PI;

    const galaxyGroup = new THREE.Group();
    scene.add(galaxyGroup);

    // --- 1. ESTRELLAS ---
    const starCount = 3500;
    const starGeometry = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);

    for(let i = 0; i < starCount * 3; i+=3) {
      starPos[i] = (Math.random() - 0.5) * 300;
      starPos[i+1] = (Math.random() - 0.5) * 300;
      starPos[i+2] = (Math.random() - 0.5) * 300;
    }
    starGeometry.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.45, transparent: true, opacity: 0.9 });
    const starField = new THREE.Points(starGeometry, starMaterial);
    galaxyGroup.add(starField);

    // --- 2. CORAZÓN 3D ---
    const heartGroup = new THREE.Group();
    const heartCount = 4000;
    const heartPos = new Float32Array(heartCount * 3);

    for (let i = 0; i < heartCount; i++) {
      let t = Math.PI * (Math.random() * 2 - 1);
      let u = (Math.random() - 0.5);

      let x = 16 * Math.pow(Math.sin(t), 3);
      let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      let z = u * 2.5;

      heartPos[i * 3]     = (x + (Math.random() - 0.5) * 0.8) * 0.6;
      heartPos[i * 3 + 1] = (y + (Math.random() - 0.5) * 0.8) * 0.6;
      heartPos[i * 3 + 2] = (z + (Math.random() - 0.5) * 0.8) * 0.6;
    }

    const heartGeometry = new THREE.BufferGeometry();
    heartGeometry.setAttribute('position', new THREE.BufferAttribute(heartPos, 3));
    const heartMaterial = new THREE.PointsMaterial({
      color: 0xff0033,
      size: 0.42,
      transparent: true,
      blending: THREE.AdditiveBlending
    });
    const heartMesh = new THREE.Points(heartGeometry, heartMaterial);
    heartGroup.add(heartMesh);
    scene.add(heartGroup);

    heartGroup.scale.set(0, 0, 0);
    galaxyGroup.scale.set(0, 0, 0);

    // --- MÁSCARA ALFA CUADRADA CON ESQUINAS REDONDEADAS Y DESVANECIDO SUAVE ---
    function createSquareRoundedMask() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const w = 512, h = 512, r = 35;

      ctx.fillStyle = 'rgba(255, 255, 255, 0)';
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(r, 10);
      ctx.lineTo(w - r, 10);
      ctx.quadraticCurveTo(w - 10, 10, w - 10, r);
      ctx.lineTo(w - 10, h - r);
      ctx.quadraticCurveTo(w - 10, h - 10, w - r, h - 10);
      ctx.lineTo(r, h - 10);
      ctx.quadraticCurveTo(10, h - 10, 10, h - r);
      ctx.lineTo(10, r);
      ctx.quadraticCurveTo(10, 10, r, 10);
      ctx.closePath();
      ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

    // --- CREACIÓN DE MARCO NEBULOSA PASTELES (HUMO DENSE CUADRADO) ---
    function createSquareNebulaAura() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      // Degradado tipo humo/polvo cósmico rosa pastel
      const grad = ctx.createRadialGradient(256, 256, 180, 256, 256, 256);
      grad.addColorStop(0, 'rgba(255, 182, 193, 0.6)');
      grad.addColorStop(0.5, 'rgba(219, 112, 147, 0.3)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);
      return new THREE.CanvasTexture(canvas);
    }

    const maskSquareTexture = createSquareRoundedMask();
    const auraSquareTexture = createSquareNebulaAura();

    // --- 3. FOTO CUADRADA 1:1 CON BORDE NEBULOSA ---
    const photoTextureLoader = new THREE.TextureLoader();
    const photoGeom = new THREE.PlaneGeometry(6.8, 6.8); // Formato Cuadrado Perfecto
    const photoMat = new THREE.MeshBasicMaterial({
      side: THREE.DoubleSide,
      transparent: true,
      alphaMap: maskSquareTexture,
      opacity: 0.98
    });
    const photoMesh = new THREE.Mesh(photoGeom, photoMat);
    photoMesh.position.set(0, -1.2, 0); 
    heartGroup.add(photoMesh);

    // Aura de resplandor espacial detrás del cuadrado
    const auraGeom = new THREE.PlaneGeometry(8.5, 8.5);
    const auraMat = new THREE.MeshBasicMaterial({
      map: auraSquareTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    const auraMesh = new THREE.Mesh(auraGeom, auraMat);
    auraMesh.position.set(0, -1.2, -0.05);
    heartGroup.add(auraMesh);

    // FUNCIÓN PARA AJUSTAR IMÁGENES HORIZONTALES / VERTICALES AL CUADRADO
    function fitTextureToSquare(texture) {
      const image = texture.image;
      if (!image) return;
      const aspect = image.width / image.height;

      texture.matrixAutoUpdate = false;
      if (aspect > 1) {
        // Imagen Horizontal
        texture.repeat.set(1 / aspect, 1);
        texture.offset.set((1 - 1 / aspect) / 2, 0);
      } else {
        // Imagen Vertical
        texture.repeat.set(1, aspect);
        texture.offset.set(0, (1 - aspect) / 2);
      }
    }

    // ARREGLO DE 15 FOTOS
    const misFotos = [
      'foto1.jpg', 'foto2.jpg', 'foto3.jpg', 'foto4.jpg', 'foto5.jpg',
      'foto6.jpg', 'foto7.jpg', 'foto8.jpg', 'foto9.jpg', 'foto10.jpg',
      'foto11.jpg', 'foto12.jpg', 'foto13.jpg', 'foto14.jpg', 'foto15.jpg'
    ];
    const photoTextures = [];

    misFotos.forEach(foto => {
      photoTextureLoader.load(foto, (tex) => {
        fitTextureToSquare(tex);
        photoTextures.push(tex);
        if (photoTextures.length === 1) photoMat.map = tex;
      });
    });

    let currentFotoIdx = 0;
    setInterval(() => {
      if (photoTextures.length > 0) {
        currentFotoIdx = (currentFotoIdx + 1) % photoTextures.length;
        photoMat.map = photoTextures[currentFotoIdx];
        photoMat.needsUpdate = true;
      }
    }, 3800);

    // --- 4. ONDAS DE CORAZÓN ---
    const heartWaves = [];
    function createHeartWave() {
      const waveMesh = heartMesh.clone();
      waveMesh.material = heartMaterial.clone();
      waveMesh.material.opacity = 0.65;
      scene.add(waveMesh);
      heartWaves.push({ mesh: waveMesh, scale: heartGroup.scale.x, opacity: 0.65 });
    }

    // --- 5. ELEMENTOS FLOTANTES (CORAZONES 💖) ---
    const floatingItems = [];
    function createFloatingItem() {
      if (floatingItems.length > 20) return;
      
      const canvas = document.createElement('canvas');
      canvas.width = 64; canvas.height = 64;
      const ctx = canvas.getContext('2d');
      ctx.font = '36px Arial';

      ctx.fillText('💖', 10, 45);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.85 });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(1.9, 1.9, 1);

      sprite.position.x = (Math.random() - 0.5) * 22;
      sprite.position.y = (Math.random() - 0.5) * 16;
      sprite.position.z = (Math.random() - 0.5) * 10;
      
      galaxyGroup.add(sprite);
      floatingItems.push({ sprite, speedY: 0.025 + Math.random() * 0.02, opacity: 0.85 });
    }

    // --- 6. FRASES ---
    const frases = [
      "Mi Theriancita 🐾", 
      "Te amo con el alma ❤️", 
      "Eres mi lugar favorito ✨",
      "Gracias por ser mía 💖", 
      "Mi corazón es tuyo 💕", 
      "Feliz día de la novia 🌹",
      "Mi novia es mi universo 🌌", 
      "Mi persona favorita 🧸", 
      "Juntos por siempre ♾️",
      "Mi lugar seguro 🏡", 
      "Eres mi sueño hecho realidad 💫", 
      "Gracias por existir 👑",
      "Una mujer como tú 💎",
      "Solo tú y yo 👩‍❤️‍👨",
      "Nadie brilla como tú ✨",
      "Es que tú eres una Therian 🐾",
      "Somos virolos❤️"
      "Solo en tus labios hay calma❤️"
      "Mis desvelos tienen tu voz❤️"
      "Mi pinchechita hemocha😘"
    ];

    function createTextSprite(message) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512;
      canvas.height = 128;

      ctx.font = 'Bold 28px Arial';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ff0033';
      ctx.shadowBlur = 14;
      ctx.textAlign = 'center';
      ctx.fillText(message, 256, 64);

      const texture = new THREE.CanvasTexture(canvas);
      const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMaterial);
      sprite.scale.set(11, 2.75, 1);
      return sprite;
    }

    frases.forEach((frase, index) => {
      const sprite = createTextSprite(frase);
      const angle = (index / frases.length) * Math.PI * 2;
      const radius = 27 + (index % 3) * 4; 
      sprite.position.x = Math.cos(angle) * radius;
      sprite.position.y = (Math.sin(index * 2) * 9);
      sprite.position.z = Math.sin(angle) * radius;
      galaxyGroup.add(sprite);
    });

    // --- 7. SNOOPYS FLOTANTES ---
    const imagenesSnoopy = [
      'snoopy1.png', 'snoopy2.png', 'snoopy3.png', 'snoopy4.png', 'snoopy5.png'
    ];

    imagenesSnoopy.forEach((imgSrc, index) => {
      photoTextureLoader.load(imgSrc, (texture) => {
        const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(6.5, 6.5, 1);

        const angle = ((index + 0.2) / imagenesSnoopy.length) * Math.PI * 2;
        const radius = 22;
        sprite.position.x = Math.cos(angle) * radius;
        sprite.position.y = (index % 2 === 0 ? 5 : -5);
        sprite.position.z = Math.sin(angle) * radius;

        galaxyGroup.add(sprite);
      });
    });

    // --- LÓGICA INTRO ---
    const textoIntro = "Tal vez no te puedo dar algo físico o algún detalle muy hermoso, pero no quería quedarme sin hacer nada, así que espero que te guste, Theriancita";
    const typewriterElement = document.getElementById('typewriter');
    const startScreen = document.getElementById('start-screen');
    const music = document.getElementById('bg-music');

    let charIndex = 0;
    let musicStarted = false;
    let holePhase = false;
    let introFinished = false;

    function typeWriterEffect() {
      if (charIndex < textoIntro.length) {
        typewriterElement.textContent += textoIntro.charAt(charIndex);
        charIndex++;
        setTimeout(typeWriterEffect, 100);
      } else {
        const dotsSpan = document.createElement('span');
        dotsSpan.className = 'loading-dots';
        typewriterElement.appendChild(dotsSpan);
      }
    }

    window.addEventListener('click', startExperience, { once: true });
    window.addEventListener('keydown', startExperience, { once: true });

    function startExperience() {
      if (!musicStarted) {
        musicStarted = true;
        music.play();
        document.getElementById('hint').style.display = 'none';
        typeWriterEffect();
      }
    }

    // --- ANIMACIÓN PRINCIPAL ---
    let time = 0;
    function animate() {
      requestAnimationFrame(animate);
      time += 0.03;

      if (musicStarted && !introFinished) {
        let currentTime = music.currentTime;

        if (currentTime >= 18 && currentTime < 21) {
          if (!holePhase) {
            holePhase = true;
            startScreen.classList.add('hidden');
          }
          camera.position.z -= 0.65;
          starField.rotation.z += 0.09;
        } 
        else if (currentTime >= 21) {
          const scaleVal = THREE.MathUtils.lerp(galaxyGroup.scale.x, 1, 0.08);
          heartGroup.scale.set(scaleVal, scaleVal, scaleVal);
          galaxyGroup.scale.set(scaleVal, scaleVal, scaleVal);

          if (Math.abs(galaxyGroup.scale.x - 1) < 0.05) {
            introFinished = true;
          }

          document.getElementById('ui').classList.add('visible');
        }
      }

      if (introFinished) {
        const beat = 1 + Math.sin(time * 3) * 0.07 + Math.pow(Math.sin(time * 6), 2) * 0.03;
        heartGroup.scale.set(beat, beat, beat);

        if (Math.sin(time * 3) > 0.96 && Math.random() < 0.3) {
          createHeartWave();
        }

        if (Math.random() < 0.06) {
          createFloatingItem();
        }

        galaxyGroup.rotation.y += 0.002;
      }

      for (let i = heartWaves.length - 1; i >= 0; i--) {
        const hw = heartWaves[i];
        hw.scale += 0.025;
        hw.opacity -= 0.015;
        hw.mesh.scale.set(hw.scale, hw.scale, hw.scale);
        hw.mesh.material.opacity = hw.opacity;

        if (hw.opacity <= 0) {
          scene.remove(hw.mesh);
          hw.mesh.geometry.dispose();
          hw.mesh.material.dispose();
          heartWaves.splice(i, 1);
        }
      }

      for (let i = floatingItems.length - 1; i >= 0; i--) {
        const fi = floatingItems[i];
        fi.sprite.position.y += fi.speedY;
        fi.opacity -= 0.005;
        fi.sprite.material.opacity = fi.opacity;

        if (fi.opacity <= 0) {
          galaxyGroup.remove(fi.sprite);
          floatingItems.splice(i, 1);
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // MODAL DE MOMENTOS AL HACER CLIC EN LA FOTO CUADRADA
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    const modal = document.getElementById('cartaModal');
    const closeBtn = document.getElementById('closeBtn');
    const modalTitulo = document.getElementById('modalTitulo');
    const modalTexto = document.getElementById('modalTexto');

    window.addEventListener('click', (e) => {
      if (modal.classList.contains('active') || !startScreen.classList.contains('hidden')) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(photoMesh);

      if (intersects.length > 0) {
        const info = historiasFotos[currentFotoIdx] || { titulo: `Momento ${currentFotoIdx + 1}`, texto: "Descripción no disponible." };
        modalTitulo.textContent = info.titulo;
        modalTexto.textContent = info.texto;
        modal.classList.add('active');
      }
    });

    closeBtn.addEventListener('click', () => {
      modal.classList.remove('active');
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
